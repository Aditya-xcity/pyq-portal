<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVelocity - Study Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon_io/android-chrome-512x512.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
</head>
<body>
    <button class="mobile-sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="dashboard-shell">
        <aside class="sidebar" id="sidebar" aria-label="Main navigation">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="logo">PYQ</div>
                    <div class="brand-text">
                        <h1>XVELOCITY</h1>
                        <p>Study Dashboard</p>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <p class="nav-label">Navigation</p>
                <button class="sidebar-link active" data-nav="home" onclick="goHome(); return false;">🏠 Home</button>
                <button class="sidebar-link" data-nav="pyq" onclick="showSection('pyq'); return false;">📄 PYQs</button>
                <button class="sidebar-link" data-nav="lab" onclick="window.location.href='labmanual.html';">🧪 Lab Manuals</button>
                <button class="sidebar-link" data-nav="notes" onclick="showSection('notes'); return false;">📚 Notes</button>
                <button class="sidebar-link" data-nav="syllabus" onclick="window.location.href='syllabus.html';">📑 Syllabus</button>

                <p class="nav-label">Academic Years</p>
                <button class="sidebar-link" data-nav="year1" onclick="selectYear(1); return false;">📁 1st Year</button>
                <button class="sidebar-link" data-nav="year2" onclick="selectYear(2); return false;">📁 2nd Year</button>
                <button class="sidebar-link" data-nav="year3" onclick="selectYear(3); return false;">📁 3rd Year</button>
                <button class="sidebar-link" data-nav="year4" onclick="selectYear(4); return false;">📁 4th Year</button>

                <p class="nav-label">System</p>
                <button id="themeToggle" class="sidebar-link" data-nav="theme" aria-label="Toggle theme" aria-pressed="false">⚙ Theme</button>
            </nav>
        </aside>

        <div class="main-pane">
            <header class="site-header">
                <section class="title-section" aria-label="Site title">
                    <h1 class="glitch-title" data-text="XVELOCITY">XVELOCITY</h1>
                    <p class="subtitle">Modern Student Productivity Hub</p>
                </section>

                <div class="header-actions">
                    <nav class="quick-links" aria-label="Quick links">
                        <a class="quick-link" href="#" onclick="goHome(); return false;">Home</a>
                        <a class="quick-link" href="labmanual.html">Lab Manuals</a>
                        <a class="quick-link" href="syllabus.html">Syllabus</a>
                    </nav>

                    <div class="menu-container">
                        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="dropdownMenu">
                            <div class="menu-icon" aria-hidden="true">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <span class="menu-text">Menu</span>
                        </button>

                        <nav class="dropdown-menu" id="dropdownMenu" aria-label="Dropdown navigation">
                            <a href="#" class="menu-item" onclick="goHome(); return false;">🏠 Home</a>
                            <a href="https://drive.google.com/drive/folders/1pVTpTB8PLrDP3BXFfdnHnxM2oOzNWXt1" class="menu-item" target="_blank" rel="noopener noreferrer">📖 Introduction Page</a>
                            <a href="labmanual.html" class="menu-item">🔬 Lab Manuals</a>
                            <a href="https://www.linkedin.com/in/aditya-bhardwaj-9a9a7a341/" class="menu-item" target="_blank" rel="noopener noreferrer">👤 LinkedIn Profile</a>
                            <a href="syllabus.html" class="menu-item">📘 Syllabus</a>
                        </nav>
                    </div>
                </div>
            </header>

            <main class="main-content">
                <section class="content-section" id="contentSection" aria-live="polite">
                    <div class="welcome-message">
                        <h2>Welcome to XVeloCity</h2>
                        <p>Select a category from the left sidebar to begin</p>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- ===== PDF VIEWER MODAL ===== -->
    <dialog id="pdfModal" class="modal" aria-modal="true" aria-labelledby="pdfTitle">
        <div class="modal-content">

            <header class="modal-header">
                <h2 id="pdfTitle">PDF Viewer</h2>
                <div class="modal-controls">
                    <button class="modal-btn open-tab-btn" onclick="openPDFInNewTab()">🔗 Open in Tab</button>
                    <button class="modal-btn download-btn" onclick="downloadCurrentPDF()">📥 Download</button>
                    <button class="modal-btn close-btn" onclick="closePDFViewer()" aria-label="Close PDF viewer">✕</button>
                </div>
            </header>

            <div class="modal-body">
                <iframe id="pdfViewer" src="" frameborder="0" title="PDF document viewer"></iframe>
            </div>

        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
